name: static-checks

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight QA dependency
        run: python -m pip install PyYAML
      - name: Run repository smoke checks
        run: python scripts/repository_smoke_check.py
